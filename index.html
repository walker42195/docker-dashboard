<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Hub — Homelab Överblick</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/webp" href="images/docker_harbor.webp">
</head>
<body>
  <div class="layout">
    <header class="header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon-wrap">
            <img src="images/docker_harbor.webp" alt="Docker Hub" class="brand-icon">
          </div>
          <div>
            <h1 class="brand-title">Homelab Containers</h1>
            <p class="brand-subtitle">Central överblick för 10.0.0.45 &amp; 10.0.0.139</p>
          </div>
        </div>

        <div class="stats-pills">
          <div class="stat-pill" id="stat-total">
            <span class="stat-number">17</span>
            <span class="stat-label">Tjänster</span>
          </div>
          <div class="stat-pill" id="stat-active">
            <span class="stat-dot active"></span>
            <span class="stat-number" id="count-active">8</span>
            <span class="stat-label">Aktiva</span>
          </div>
          <div class="stat-pill" id="stat-inactive">
            <span class="stat-dot inactive"></span>
            <span class="stat-number" id="count-inactive">9</span>
            <span class="stat-label">Inaktiva</span>
          </div>
        </div>
      </div>

      <div class="controls-bar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Sök container, tjänst, port eller server..." autocomplete="off">
          <button id="clear-search" class="clear-btn" aria-label="Rensa sökning" style="display: none;">&times;</button>
        </div>

        <div class="filters-group" role="tablist" aria-label="Filter efter server och status">
          <button class="filter-btn active" data-filter="all">Alla <span class="badge">17</span></button>
          <button class="filter-btn" data-filter="host-45">10.0.0.45 <span class="badge">8</span></button>
          <button class="filter-btn" data-filter="host-139">10.0.0.139 <span class="badge">9</span></button>
          <button class="filter-btn" data-filter="status-active">Aktiva <span class="badge">8</span></button>
          <button class="filter-btn" data-filter="status-inactive">Inaktiva <span class="badge">9</span></button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div id="services-grid" class="services-grid">
        <!-- Renderas dynamiskt av app.js -->
      </div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <p class="empty-title">Inga containrar matchade sökningen</p>
        <p class="empty-desc">Prova en annan sökterm eller återställ filtret.</p>
        <button class="reset-filter-btn" id="reset-filter-btn">Visa alla</button>
      </div>
    </main>

    <footer class="footer">
      <p>Docker Service Hub &bull; 10.0.0.45 &amp; 10.0.0.139 &bull; Genererat med Flux 1 dev &amp; Antigravity</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
